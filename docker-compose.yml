services:
  hackwae-voice-server:
    build:
      context: .
      dockerfile: Dockerfile

    image: hackwae-voice-server:0.1.0

    container_name: hackwae-voice-server

    restart: unless-stopped

    ports:
      - "8082:8082"

    environment:
      TZ: Asia/Makassar
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

    volumes:
      # Persistent model storage.
      - /AppData/HackWaeVoiceServer/models:/ai/models

      # Persistent voice storage.
      - /AppData/HackWaeVoiceServer/voices:/ai/voices

      # Persistent application state:
      # history, queue, cache, logs, previews, temp, downloads.
      - /AppData/HackWaeVoiceServer/storage:/app/storage

      # Persistent uploaded packages.
      - /AppData/HackWaeVoiceServer/uploads:/app/uploads

      # Persistent generated output.
      - /AppData/HackWaeVoiceServer/output:/app/output

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
